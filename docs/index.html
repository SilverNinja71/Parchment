<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parchment</title>
<style>
  :root { --ink: #1f2430; --muted: #5b6272; --accent: #0a60ff; --paper: #fbf9f5; }
  @media (prefers-color-scheme: dark) { :root { --ink: #eceef3; --muted: #a3a9b6; --paper: #1c1d21; } }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 64px 16px; }
  h1 { font-family: "New York", Georgia, serif; font-size: 2.6rem; margin: 0; }
  p { color: var(--muted); }
  a { color: var(--accent); }
  ul { padding-left: 1.2rem; }
</style>
</head>
<body>
<main>
  <h1>Parchment</h1>
  <p>A free, privacy-first handwriting notes app for iPad. No ads, no subscriptions.</p>
  <ul>
    <li><a href="https://github.com/SilverNinja71/Parchment">Source code and how to help</a></li>
    <li><a href="https://github.com/SilverNinja71/Parchment/issues">Support and bug reports</a></li>
    <li><a href="privacy.html">Privacy policy</a></li>
  </ul>
</main>
</body>
</html>
